<style>
/* Layout: one-column iOS app, large title, light grouped cards on a plain white page, floating tab bar. Single light theme by choice. */
:root{
  --bg:#ffffff; --b1:#ffffff; --b2:#ffffff; --b3:#ffffff;
  --glass:rgba(242,242,247,.82); --glass-hi:rgba(255,255,255,.94); --stroke:rgba(0,0,0,.05); --edge:rgba(30,40,80,.08);
  --fg:#101217; --fg2:#5b5f6d; --fg3:#8c909c; --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12);
  --accent:#007aff; --green:#28a745; --orange:#e08600; --red:#e5332a; --on-accent:#fff;
  --c-blue:#007aff; --c-green:#34c759; --c-indigo:#5856d6; --c-orange:#ff9500; --c-pink:#ff2d55; --c-purple:#af52de; --c-red:#ff3b30; --c-teal:#30b0c7;
  --shadow:0 6px 20px rgba(30,40,80,.06), 0 1px 2px rgba(30,40,80,.05);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-d:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r:26px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wall{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(40% 35% at 10% 8%,var(--b1),transparent 70%),
  radial-gradient(45% 35% at 95% 30%,var(--b2),transparent 70%),
  radial-gradient(50% 40% at 30% 95%,var(--b3),transparent 70%),var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.num{font-variant-numeric:tabular-nums}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.35);border-radius:var(--r)}

/* Large title header */
.lt{display:flex;flex-direction:column;gap:12px;padding-top:18px}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-d);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.eyebrow{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.wx{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:20px}
.wx-i{font-size:30px;line-height:1;color:var(--orange)}
.wx b{font-size:22px;font-weight:700}
.wx .s{font-size:13px;color:var(--fg2);margin-top:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;color:var(--fg2)}
.chip.on{background:var(--fg);color:var(--bg)}
.chip.add{color:var(--accent)}

/* What-if switch */
.wi{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg2);padding:6px 6px 6px 12px;border-radius:999px}
.sw{width:51px;height:31px;border-radius:999px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}

/* Summary */
.sum{display:flex;align-items:center;gap:20px;padding:20px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--font-d);font-size:30px;font-weight:700;letter-spacing:-.02em}
.ring .v span{font-size:11px;color:var(--fg2);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stats{display:grid;gap:10px;min-width:0;flex:1}
.stat small{display:block;font-size:12px;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-weight:650}

.banner{padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px;color:var(--fg2);flex-wrap:wrap}
.banner b{color:var(--fg)}

/* Grouped lists */
.sec-h{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;padding:0 16px 6px;display:flex;justify-content:space-between;gap:10px}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row.tap:active{background:var(--fill)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:550;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--fg2);margin-top:2px}
.row .r{display:flex;align-items:center;gap:10px;flex:none;text-align:right}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.chev{color:var(--fg3);font-size:20px;line-height:1}
.badge{min-width:42px;padding:4px 8px;border-radius:10px;font-weight:700;font-size:15px;text-align:center;color:#fff}
.g-A{background:var(--green)} .g-B{background:var(--accent)} .g-C{background:var(--orange)} .g-D,.g-F{background:var(--red)} .g-S{background:var(--fill);color:var(--fg2)}
.addrow{color:var(--accent);font-weight:600}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;border:1px dashed var(--accent);color:var(--accent);margin-left:6px;vertical-align:2px}
.struck{text-decoration:line-through;color:var(--fg3)}
.whatif .t{font-style:italic}
.empty{padding:28px 20px;text-align:center;color:var(--fg2);display:grid;gap:12px;justify-items:center}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px}
.navbtn{padding:9px 14px;border-radius:999px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px}
.hero{padding:22px 20px;display:grid;gap:14px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.big{font-family:var(--font-d);font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big small{font-size:24px;font-weight:600;color:var(--fg2)}
.hero .badge{font-size:26px;padding:8px 14px;border-radius:16px}
.meta{font-size:14px;color:var(--fg2)}
.bar{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}

/* Final calculator */
.calc{padding:18px 16px;display:grid;gap:14px}
.calc h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.need{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.need div{background:var(--fill);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.need b{font-weight:700}
.need .ok{color:var(--green);font-size:13px;font-weight:600}
.need .no{color:var(--red);font-size:13px;font-weight:600}
.need .n{font-weight:650}
.note{font-size:13px;color:var(--fg2);line-height:1.45;margin:0}

.btn{padding:12px 18px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn.danger{background:var(--fill);color:var(--red)}
.btn.armed{background:var(--red);color:#fff}

/* Tab bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:4px;padding:6px;border-radius:999px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 22px;border-radius:999px;font-size:11px;font-weight:600;color:var(--fg2)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent);background:var(--fill)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:620px;max-height:92%;overflow:auto;background:var(--glass-hi);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--stroke);border-radius:30px 30px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .32s cubic-bezier(.2,.9,.3,1)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill);margin:4px auto 6px}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px;gap:8px}
.sh-h h3{margin:0;font-size:17px;font-weight:650;text-align:center;flex:1}
.sh-h button{color:var(--accent);font-weight:500;padding:6px 4px;min-width:64px}
.sh-h .save{font-weight:700;text-align:right}
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.fl{background:var(--glass);border-radius:18px;overflow:hidden;border:1px solid var(--stroke)}
.fr{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:48px;position:relative}
.fr+.fr::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.fr label{flex:none;font-weight:500}
.fr input,.fr select{flex:1;min-width:0;border:0;background:transparent;text-align:right;font-size:16px;outline:none;padding:4px 0}
.fr input::placeholder{color:var(--fg3)}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;flex:1}
.seg button{flex:1;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--glass-hi);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cats .fr input{text-align:left}
.cats .w{max-width:64px;text-align:right}
.cats .d{max-width:44px;text-align:right}
.cats .x{color:var(--red);font-size:20px;width:26px}
.colors{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;flex:1;min-width:0}
.colors button{width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--fg)}
.hint{font-size:13px;color:var(--fg2);padding:0 14px;margin:-10px 0 0}
.scale .fr input{max-width:70px}
.scale .fr .l{width:40px;font-weight:700}
.scale .hd{font-size:12px;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* Motion: springy presses, ring fill, letter pop, view entrance */
.tap,.btn,.chip,.navbtn,.tab,.wi,.ck{transition:transform .38s cubic-bezier(.3,1.6,.5,1),background-color .2s,color .2s}
.tap:active,.btn:active,.chip:active,.navbtn:active,.tab:active,.wi:active,.ck:active{transform:scale(.95)}
.row.tap:active{transform:scale(.985)}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.arc.anim{animation:ring 1s cubic-bezier(.2,.9,.3,1)}
@keyframes ring{from{stroke-dashoffset:var(--from)}}
.bar i{transition:width .8s cubic-bezier(.2,.9,.3,1)}
.enter>*{animation:rise .5s cubic-bezier(.2,.9,.3,1) backwards}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{transform:translateY(16px);opacity:.35}}
/* Warnings */
.warn .row{align-items:flex-start}
.warn .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;margin-top:1px}
.warn .ic svg{width:16px;height:16px}
.ic.orange{background:var(--orange)} .ic.red{background:var(--red)}
.warn .main{text-align:left}
.ack{font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:999px;background:var(--fill);flex:none}
.hero-warn{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.hero-warn.orange{color:var(--orange)} .hero-warn.red{color:var(--red)}
/* Import */
textarea{width:100%;min-height:150px;border:0;background:transparent;font:inherit;font-size:15px;color:var(--fg);padding:12px 14px;resize:vertical;outline:none}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;padding:22px 14px;border:1.5px dashed var(--sep);border-radius:18px;color:var(--accent);font-weight:600;cursor:pointer;text-align:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--stroke)}
.irow{display:flex;gap:10px;padding:10px 14px;align-items:flex-start;position:relative}
.irow+.irow::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--sep)}
.irow .main{flex:1;min-width:0;display:grid;gap:6px}
.irow input,.irow select{border:0;background:var(--fill);border-radius:8px;padding:6px 8px;font-size:15px;min-width:0;outline:none}
.irow .nm{width:100%;font-weight:550}
.irow .line{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.irow .sc{width:62px;text-align:right}
.irow select{flex:1;min-width:110px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--fg2)}
.tag.new{color:var(--green)} .tag.upd{color:var(--accent)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--fg3);flex:none;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:800;margin-top:3px}
.ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
.irow.off .main{opacity:.45}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.block{width:100%;padding:14px}
.btn[disabled]{opacity:.5}
.nav-r{display:flex;gap:8px}
/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:14px;border-radius:20px;display:grid;gap:4px;min-width:0;align-content:start}
.tile small{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em}
.tile b{font-family:var(--font-d);font-size:26px;font-weight:700;letter-spacing:-.02em}
.tile .d{font-size:12px;font-weight:600;color:var(--fg2);line-height:1.3}
.up{color:var(--green)!important}.down{color:var(--red)!important}
.card{padding:16px;display:grid;gap:12px;min-width:0}
.card h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.ch-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg.small{flex:none}
.seg.small button{padding:5px 10px;font-size:13px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;color:var(--fg)}
.lg i{width:10px;height:10px;border-radius:50%}
.lg.dim{opacity:.4}
.chart-wrap{position:relative;touch-action:pan-y}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;background:var(--glass-hi);border:1px solid var(--sep);box-shadow:var(--shadow);border-radius:12px;padding:8px 10px;font-size:12px;display:grid;gap:3px;pointer-events:none;min-width:150px;z-index:2}
.tip .h{font-weight:700;color:var(--fg2)}
.tip div{display:flex;align-items:center;gap:6px}
.tip i{width:8px;height:8px;border-radius:50%;flex:none}
.tip span{margin-left:auto;padding-left:10px;font-weight:650;font-variant-numeric:tabular-nums}
.spark{width:84px;height:28px;flex:none}
.drow{display:flex;align-items:center;gap:10px;padding:10px 14px;position:relative;flex-wrap:wrap}
.drow+.drow::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.drow .main{flex:1 1 150px;min-width:0}
.drow .t{font-weight:550;overflow-wrap:anywhere}
.drow .s{font-size:13px;color:var(--fg2);margin-top:2px}
.drow .ctl{display:flex;align-items:center;gap:8px;margin-left:auto}
.drow input[type=date]{border:0;background:var(--fill);border-radius:8px;padding:6px 8px;font-size:15px;min-width:138px;outline:none}
.drow.missing input[type=date]{box-shadow:inset 0 0 0 1.5px var(--orange)}
.same{font-size:12px;font-weight:600;color:var(--accent);padding:6px 8px;border-radius:8px;background:var(--fill);white-space:nowrap}
.dates-cta{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chg{font-size:13px;font-weight:650;min-width:52px;text-align:right}
/* Search */
.search{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--fill)}
.search svg{width:18px;height:18px;color:var(--fg3);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;color:var(--fg)}
mark{background:rgba(255,204,0,.38);color:inherit;border-radius:3px;padding:0 1px}
/* Semester progress */
.prog .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.prog .top b{font-family:var(--font-d);font-size:26px;font-weight:700;letter-spacing:-.02em}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px 14px;position:relative;align-items:center}
.prow+.prow::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep)}
.prow .t{font-weight:550;display:flex;align-items:center;gap:8px;min-width:0}
.prow .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .bar{grid-column:1/-1;height:6px}
.prow .s{grid-column:1/-1;font-size:13px;color:var(--fg2)}
/* Report card */
.rc-ic{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;font-weight:700}
.help{width:24px;height:24px;border-radius:50%;background:var(--fill);color:var(--accent);font-size:14px;font-weight:700;line-height:1;display:inline-grid;place-items:center;flex:none;padding:0;text-transform:none;letter-spacing:0}
#helpPop .hp-bg{position:fixed;inset:0;z-index:60;background:rgba(10,12,20,.35)}

<script>
(function(){
const KEY='gradebook.v1';
const uid=()=>Math.random().toString(36).slice(2,10);
const isNum=v=>v!==null&&v!==''&&v!==undefined&&!isNaN(+v);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const DEFAULT_SCALE=[["A",94,4.0],["A-",90,3.7],["B+",87,3.3],["B",84,3.0],["B-",80,2.7],["C+",77,2.3],["C",74,2.0],["C-",70,1.7],["D",65,1.0],["F",0,0]].map(([l,min,gp])=>({l,min,gp}));
const STATUSES={'':'Graded','CR':'CR · Credit earned','NC':'NC · No credit earned','INC':'INC · Incomplete','MED':'MED · Medical leave'};
const COLORS=['blue','green','indigo','orange','pink','purple','red','teal'];

function sample(){
  const it=(name,score,max,whatIf)=>({id:uid(),name,score,max,whatIf:!!whatIf});
  const cat=(name,weight,items)=>({id:uid(),name,weight,items});
  return {id:uid(),name:'Fall 2026',classes:[
    {id:uid(),name:'AP Biology',credits:1,color:'green',mode:'weighted',status:'',example:true,finalCat:null,finalPoints:100,categories:[
      cat('Homework',20,[it('Cell structure worksheet',18,20),it('Membrane transport',19,20),it('Enzymes problem set',16,20)]),
      cat('Quizzes',15,[it('Quiz 1',8,10),it('Quiz 2',10,10),it('Quiz 3',6,10)]),
      cat('Labs',20,[it('Osmosis lab',46,50),it('Catalase lab',43,50)]),
      cat('Unit tests',25,[it('Unit 1 test',88,100),it('Unit 2 test',90,100,true)]),
      cat('Final exam',20,[])]},
    {id:uid(),name:'English 11',credits:1,color:'blue',mode:'weighted',status:'',example:true,finalCat:null,finalPoints:100,categories:[
      cat('Essays',40,[it('Personal narrative',91,100),it('Gatsby analysis',85,100)]),
      cat('Reading quizzes',20,[it('Ch. 1–3',9,10),it('Ch. 4–6',7,10),it('Ch. 7–9',10,10)]),
      cat('Participation',10,[it('September',10,10),it('October',9,10)]),
      cat('Final essay',30,[])]},
    {id:uid(),name:'Precalculus',credits:1,color:'orange',mode:'points',status:'',example:true,finalCat:null,finalPoints:150,categories:[
      cat('Homework',0,[it('HW 1.1',10,10),it('HW 1.2',8,10),it('HW 1.3',9,10)]),
      cat('Tests',0,[it('Functions test',78,100),it('Trig test',84,100)]),
      cat('Final exam',0,[])]},
    {id:uid(),name:'Health',credits:0.5,color:'purple',mode:'weighted',status:'CR',example:true,finalCat:null,finalPoints:100,categories:[
      cat('Assignments',100,[it('Nutrition log',20,20)])]}
  ]};
}
function fresh(){const sem=sample();return {v:1,updatedAt:0,name:'',curSem:sem.id,semesters:[sem],scale:DEFAULT_SCALE.map(r=>({...r})),round:false,examples:true};}

let S=null, lkey=KEY+'.local';
const ui={route:{view:'loading'},wi:false,sync:'device',msg:'',range:'sem',focus:null,from:'dash',auth:{mode:'in',msg:'',email:''},acct:null,setup:null,carry:null,pay:null,payMsg:'',checking:false};
function loadLocal(k){lkey=k; S=null; try{const raw=localStorage.getItem(k); if(raw) S=JSON.parse(raw);}catch(e){} if(S&&!Array.isArray(S.semesters)) S=null;}
const firstName=()=>String((S&&S.name)||'').trim().split(/\s+/)[0]||'';
const defaultCats=()=>[['Homework',20],['Quizzes',20],['Tests',35],['Final exam',25]].map(([name,weight])=>({id:uid(),name,weight,items:[]}));
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>dstr(new Date());
const dnum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
const nstr=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());};
const shortDate=s=>{if(!s)return '';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'});};
const isDate=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);

/* ---------- persistence ---------- */
let ref=null, writeTimer=null, writing=false, dirty=false;
function save(){
  if(!S) return;
  S.updatedAt=Date.now();
  try{localStorage.setItem(lkey,JSON.stringify(S));}catch(e){}
  if(ref){clearTimeout(writeTimer);writeTimer=setTimeout(flush,700);}
}
async function flush(){
  if(!ref||!S) return;
  if(writing){dirty=true;return;}
  writing=true;
  try{await ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt});ui.sync='account';}
  catch(e){ui.sync='error';}
  writing=false;
  if(dirty){dirty=false;flush();}
}
function migrate(){ if(S&&S.name===undefined) S.name=''; }

/* ---------- accounts (Supabase) ---------- */
const CFG=(()=>{const c=window.GB_SUPABASE; return c&&/^https:\/\//.test(c.url||'')&&c.key&&!/PASTE/.test(c.key)?c:null;})();
const SB_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/+esm';
let sb=null, curUid=null;
const isGate=v=>v==='loading'||v==='auth'||v==='setup'||v==='paywall'||v==='welcome';

/* ---------- one-time purchase (Lemon Squeezy) ---------- */
const PRICE='$5';
const CHECKOUT=(()=>{const u=String(window.GB_CHECKOUT||'').trim(); return /^https:\/\//.test(u)?u:'';})();
// ui.pay.state: free (free forever) | paid | none (hasn't bought it yet)
const hasAccess=()=>!ui.pay||ui.pay.state==='free'||ui.pay.state==='paid';
const locked=()=>!hasAccess();
async function loadAccess(u){
  const {data,error}=await sb.from('access').select('paid_at,free_forever').eq('user_id',u.id).maybeSingle();
  if(error) return;
  const d=data||{};
  ui.pay={state:d.free_forever?'free':d.paid_at?'paid':'none'};
}
function checkoutUrl(){
  const q=[['checkout[custom][user_id]',curUid],['checkout[email]',ui.acct&&ui.acct.email],['checkout[name]',ui.acct&&ui.acct.name]].filter(([,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  return CHECKOUT+(CHECKOUT.includes('?')?'&':'?')+q;
}
function buyNow(){ if(CHECKOUT&&curUid) location.href=checkoutUrl(); }
function unlocked(prev){
  ui.payMsg=''; if(S) save();
  if(ui.pay.state==='paid'&&prev!=='paid') celebrate([],'Thanks! Grade Book is yours to keep.');
}
async function payCheck(manual){
  if(!sb||!curUid||ui.checking) return;
  const u=(await sb.auth.getUser()).data.user; if(!u) return;
  const prev=ui.pay&&ui.pay.state;
  ui.checking=true; ui.payMsg=''; render();
  for(let i=0;i<(manual?1:10);i++){
    try{ await loadAccess(u); }catch(e){}
    if(hasAccess()) break;
    if(!manual) await new Promise(r=>setTimeout(r,3000));
  }
  ui.checking=false;
  if(hasAccess()){ afterLoad(); unlocked(prev); return; }
  ui.payMsg=manual?'No payment found yet. If you just paid, wait a minute and try again.':'Your payment hasn\'t shown up yet. It can take a minute. Tap "I already paid" to check again.';
  render();
}
const legalLinks=()=>`<p class="note" style="text-align:center"><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></p>`;
function afterLoad(){
  if(locked()){ if(S) migrate(); ui.route={view:'paywall'}; }
  else if(!S){ ui.setup=ui.setup||{name:'',classes:['','','']}; ui.route={view:'setup'}; }
  else { migrate(); if(ui.acct&&ui.acct.name&&S.name!==ui.acct.name){ S.name=ui.acct.name; save(); } if(syncSeen()) save(); if(isGate(ui.route.view)) ui.route={view:'dash'}; }
  render();
}
function useLocal(){
  ref=null; curUid=null; ui.sync='device'; ui.acct=null; ui.pay=null;
  loadLocal(KEY+'.local'); afterLoad();
}
async function boot(){
  if(!CFG){ useLocal(); return; }
  try{
    const lib=await import(SB_LIB);
    sb=lib.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    sb.auth.onAuthStateChange((ev,session)=>{
      // Supabase asks that no other Supabase calls run inside this callback, so hand off.
      setTimeout(()=>{
        if(ev==='PASSWORD_RECOVERY'){ ui.auth={mode:'newpw',msg:'',email:''}; ui.route={view:'auth'}; render(); return; }
        const u=session&&session.user||null;
        if((u&&u.id)===curUid&&ev!=='INITIAL_SESSION') return;
        onUser(u);
      },0);
    });
  }catch(e){ ui.bootErr='Could not reach the sign-in service, so grades are saved on this device for now.'; useLocal(); }
}
function remoteNewer(x){ return x&&x.json&&(x.updatedAt||0)>((S&&S.updatedAt)||0); }
function takeRemote(x){ try{S=JSON.parse(x.json); localStorage.setItem(lkey,x.json);}catch(e){} }
async function pull(){
  const {data,error}=await sb.from('gradebooks').select('json,updated_at').eq('user_id',curUid).maybeSingle();
  if(error) throw error;
  return data?{json:data.json,updatedAt:+data.updated_at||0}:null;
}
async function onUser(u){
  clearTimeout(writeTimer); ref=null;
  if(!u){
    curUid=null;
    let m=null; try{m=localStorage.getItem(KEY+'.mode');}catch(e){}
    if(ui.route.view==='auth'&&ui.auth.mode==='newpw') return;
    S=null; ui.acct=null; ui.pay=null; ui.setup=null;
    if(m==='local'){
      // Grade Book used to work without an account. Bring those grades into a new account.
      loadLocal(KEY+'.local'); ui.carry=S; S=null; try{localStorage.removeItem(KEY+'.mode');}catch(e){}
      ui.auth={mode:'up',msg:'Grade Book now needs an account. Create one and the grades on this device come with you.',ok:true,email:''}; ui.route={view:'auth'}; render(); return;
    }
    ui.auth={mode:'in',msg:'',ok:false,email:ui.auth.email||''}; ui.route={view:ui.route.view==='auth'?'auth':'welcome'}; render(); return;
  }
  curUid=u.id;
  try{localStorage.removeItem(KEY+'.mode');}catch(e){}
  ui.acct={email:u.email||'',name:String((u.user_metadata&&u.user_metadata.name)||'').trim()}; ui.route={view:'loading'}; render();
  loadLocal(KEY+'.u.'+u.id);
  const r={set:async o=>{const {error}=await sb.from('gradebooks').upsert({user_id:curUid,json:o.json,updated_at:o.updatedAt}); if(error) throw error;}};
  try{
    const x=await pull();
    ref=r; ui.sync='account';
    if(x){ if(remoteNewer(x)) takeRemote(x); else if(S&&(S.updatedAt||0)>(x.updatedAt||0)) flush(); }
    if(!S&&ui.carry){ S=ui.carry; save(); }
    else if(S&&!x) flush();
  }catch(e){ ref=r; ui.sync='error'; }
  ui.carry=null;
  ui.pay=null; try{ await loadAccess(u); }catch(e){}
  afterLoad();
  if(/[?&]paid=/.test(location.search)){ history.replaceState(null,'',location.pathname); if(locked()) payCheck(false); }
}
// Pick up changes made on another device when you come back to this tab or app.
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!sb||!curUid||!ref||writing) return;
  if(ui.pay&&ui.pay.state!=='free'&&ui.pay.state!=='paid'&&!ui.checking){ try{ const u=(await sb.auth.getUser()).data.user; if(u){ const prev=ui.pay.state; await loadAccess(u); if(prev!==ui.pay.state){ const was=ui.route.view==='paywall'; afterLoad(); if(was&&hasAccess()) unlocked(prev); return; } } }catch(e){} }
  try{ const x=await pull(); if(remoteNewer(x)){ takeRemote(x); if(isGate(ui.route.view)) afterLoad(); else if(!document.querySelector('.scrim')) render(); } }catch(e){}
});
function authMsg(t,ok){ ui.auth.msg=t; ui.auth.ok=!!ok; const el=document.getElementById('au-msg'); if(el){el.textContent=t; el.style.color=ok?'var(--green)':'var(--red)';} }
function authErr(e){
  const c=e&&(e.code||'')||'', m=String(e&&e.message||'').toLowerCase();
  if(c==='invalid_credentials'||m.includes('invalid login')) return "That email and password don't match.";
  if(c==='email_not_confirmed'||m.includes('not confirmed')) return 'Confirm your email first. Open the link in the email we sent you, then sign in.';
  if(c==='user_already_exists'||m.includes('already registered')) return "There's already an account with that email. Sign in instead.";
  if(c==='weak_password'||m.includes('password should')) return 'Passwords need at least 6 characters.';
  if(c==='email_address_invalid'||m.includes('invalid format')||m.includes('is invalid')) return "That email address doesn't look right.";
  if(c==='same_password') return 'Pick a password different from your old one.';
  if(c==='over_email_send_rate_limit'||c==='over_request_rate_limit'||e&&e.status===429) return 'Too many tries. Wait a few minutes, then try again.';
  if(c==='signup_disabled') return 'New accounts are turned off for Grade Book right now.';
  if(m.includes('failed to fetch')||m.includes('network')) return 'No internet connection. Try again when you are online.';
  return 'Sign-in did not work'+(e&&e.message?': '+e.message:'.');
}
async function authSubmit(){
  if(!sb) return;
  const m=ui.auth.mode, email=val('au-e'), pwEl=document.getElementById('au-p'), pw=pwEl?pwEl.value:'', name=val('au-n');
  if(m==='up'){ ui.auth.name=name; if(!name){authMsg('Enter your name.');return;} }
  if(m!=='newpw'){ ui.auth.email=email; if(!email){authMsg('Enter your email.');return;} }
  if(m!=='reset'&&!pw){authMsg(m==='newpw'?'Enter a new password.':'Enter your password.');return;}
  if((m==='up'||m==='newpw')&&pw.length<6){authMsg('Passwords need at least 6 characters.');return;}
  const btn=document.querySelector('[data-act="auGo"]'); if(btn) btn.disabled=true; authMsg('');
  try{
    if(m==='reset'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL}); if(error) throw error;
      ui.auth={mode:'in',email,msg:'If there is an account for '+email+', a reset link is on its way. Check your email.',ok:true}; render();
    } else if(m==='newpw'){
      const {error}=await sb.auth.updateUser({password:pw}); if(error) throw error;
      const {data}=await sb.auth.getSession(); history.replaceState(null,'',location.pathname);
      ui.auth={mode:'in',msg:'',email:''}; onUser(data&&data.session?data.session.user:null);
    } else if(m==='up'){
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:APP_URL,data:{name}}}); if(error) throw error;
      if(data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length) throw {code:'user_already_exists'};
      if(!data.session){ ui.auth={mode:'in',email,msg:'Almost done. Open the link we emailed to '+email+' to confirm your account, then sign in here.',ok:true}; render(); }
    } else {
      const {error}=await sb.auth.signInWithPassword({email,password:pw}); if(error) throw error;
    }
  }catch(e){ authMsg(authErr(e)); }
  const b2=document.querySelector('[data-act="auGo"]'); if(b2) b2.disabled=false;
}
async function saveName(){
  const name=val('acct-n'), msg=t=>{const el=document.getElementById('acct-msg'); if(el) el.textContent=t;};
  if(!name){msg('Enter your name.');return;}
  try{ const {error}=await sb.auth.updateUser({data:{name}}); if(error) throw error; ui.acct.name=name; S.name=name; save(); render(); }
  catch(e){ msg('Could not save your name. Check your connection and try again.'); }
}
async function signOutNow(){
  if(!sb) return;
  clearTimeout(writeTimer); if(ref) await flush();
  if(ui.sync!=='error'){ try{localStorage.removeItem(lkey);}catch(e){} }
  await sb.auth.signOut();
}
function setupDone(){
  const st=ui.setup, names=st.classes.map(n=>n.trim()).filter(Boolean);
  if(!names.length){ const el=document.getElementById('su-msg'); if(el) el.textContent='Add at least one class, or tap Try example classes.'; return; }
  const d=new Date(), semName=(d.getMonth()>=6?'Fall ':'Spring ')+d.getFullYear();
  const sm={id:uid(),name:semName,classes:names.map((n,i)=>({id:uid(),name:n,credits:1,color:COLORS[i%COLORS.length],mode:'weighted',status:'',example:false,catsChecked:false,finalCat:null,finalPoints:100,categories:defaultCats()}))};
  S={v:1,updatedAt:0,name:(ui.acct&&ui.acct.name)||st.name.trim(),curSem:sm.id,semesters:[sm],scale:DEFAULT_SCALE.map(r=>({...r})),round:false,examples:false};
  save(); ui.setup=null; afterLoad();
}

/* ---------- math ---------- */
const sem=()=>S.semesters.find(s=>s.id===S.curSem)||S.semesters[0];
const findClass=id=>{for(const s of S.semesters){const c=s.classes.find(c=>c.id===id);if(c)return c;}return null;};
function catStats(cat,wi,filt){
  let items=cat.items.filter(i=>isNum(i.score)&&+i.max>0&&(wi||!i.whatIf)&&(!filt||filt(i)));
  const earned=items.reduce((a,i)=>a+ +i.score,0), max=items.reduce((a,i)=>a+ +i.max,0);
  return {earned,max,pct:max?earned/max*100:null};
}
function classGrade(c,wi,skip,filt){
  const st=c.categories.filter(k=>k.id!==skip).map(k=>({k,s:catStats(k,wi,filt)}));
  if(c.mode==='points'){const e=st.reduce((a,x)=>a+x.s.earned,0),m=st.reduce((a,x)=>a+x.s.max,0);return m?e/m*100:null;}
  let tw=0,acc=0;st.forEach(({k,s})=>{if(s.pct!=null&&+k.weight>0){tw+=+k.weight;acc+=k.weight*s.pct;}});
  return tw?acc/tw:null;
}
const sortedScale=()=>[...S.scale].sort((a,b)=>b.min-a.min);
function letterFor(p){const v=S.round?Math.round(p):p;const sc=sortedScale();return sc.find(r=>v>=r.min)||sc[sc.length-1];}
function gpaOf(classes,wi){
  let cr=0,pts=0;
  classes.forEach(c=>{if(c.status)return;const g=classGrade(c,wi);if(g==null)return;const cc=+c.credits||0;cr+=cc;pts+=cc*letterFor(g).gp;});
  return cr?{gpa:pts/cr,cr}:null;
}
const gcls=l=>'g-'+(l||'S')[0];
function finalCatOf(c){
  return c.categories.find(k=>k.id===c.finalCat)||c.categories.find(k=>/final/i.test(k.name))||[...c.categories].reverse().find(k=>!k.items.length)||c.categories[c.categories.length-1];
}

/* ---------- haptics + motion ---------- */
const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
const hapticLbl=(()=>{try{const l=document.createElement('label');l.setAttribute('aria-hidden','true');l.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;l.appendChild(i);document.body.appendChild(l);return l;}catch(e){return null;}})();
function haptic(strong){
  try{if(navigator.vibrate) navigator.vibrate(strong?[12,40,14]:9);}catch(e){}
  try{if(hapticLbl) hapticLbl.click();}catch(e){}
}
ui.prev={};
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const key=el.dataset.key, to=+el.dataset.val, dec=+el.dataset.dec, from=ui.prev[key];
    ui.prev[key]=to;
    if(reduced()||from===to||isNaN(to)) return;
    const start=from==null?0:from, t0=performance.now(), dur=from==null?900:600;
    const step=now=>{const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); if(!el.isConnected) return; el.textContent=(start+(to-start)*e).toFixed(dec); if(k<1) requestAnimationFrame(step);};
    el.textContent=start.toFixed(dec); requestAnimationFrame(step);
  });
}
function letterBadge(key,L,extra=''){
  const prev=ui.prev['L'+key]; ui.prev['L'+key]=L.l;
  return `<span class="badge ${gcls(L.l)} ${prev&&prev!==L.l?'pop':''}" ${extra}>${esc(L.l)}</span>`;
}

/* ---------- warnings ---------- */
const ICON_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>';
const ICON_DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
function setupWarnings(c){
  const out=[]; if(c.example) return out;
  if(c.catsChecked===false) out.push({c,kind:'setup',sev:'orange',icon:ICON_WARN,text:`${c.name} is using sample categories. Check them against your syllabus.`,short:'Using sample categories. Check your syllabus.'});
  else if(c.mode!=='points'&&c.categories.length){ const tw=c.categories.reduce((a,k)=>a+(+k.weight||0),0);
    if(Math.abs(tw-100)>0.01) out.push({c,kind:'weights',sev:'orange',icon:ICON_WARN,text:`${c.name}'s category weights add up to ${+tw.toFixed(2)}%, not 100%.`,short:`Weights add up to ${+tw.toFixed(2)}%, not 100%`}); }
  return out;
}
const needsCheck=c=>setupWarnings(c).length>0;
function warningsFor(c){
  const out=setupWarnings(c); if(c.status) return out;
  const g=classGrade(c,false); if(g==null) return out;
  const L=letterFor(g), sc=sortedScale(), seen=(S.seen||{})[c.id];
  if(seen){const sl=S.scale.find(r=>r.l===seen); if(sl&&sl.gp>L.gp) out.push({c,kind:'drop',sev:'red',icon:ICON_DOWN,text:`${c.name} dropped from ${seen} to ${L.l}.`,short:`Dropped from ${seen} to ${L.l}`});}
  if(L.min>0){
    const cut=S.round?L.min-.5:L.min, gap=g-cut, lower=sc[sc.indexOf(L)+1];
    if(gap<1&&lower) out.push({c,kind:'near',sev:'orange',icon:ICON_WARN,text:`${c.name} is only ${f1(Math.max(0,gap))}% above the ${L.l} cutoff. One low score could drop it to ${lower.l}.`,short:`${f1(Math.max(0,gap))}% above the ${L.l} cutoff`});
  }
  return out;
}
function syncSeen(party){
  S.seen=S.seen||{}; let ch=false; const ups=[];
  S.semesters.forEach(s=>s.classes.forEach(c=>{
    if(c.status) return; const g=classGrade(c,false); if(g==null) return;
    const L=letterFor(g), prev=S.seen[c.id], pl=prev&&S.scale.find(r=>r.l===prev);
    if(pl&&L.gp>pl.gp&&!c.example) ups.push({c,L});
    if(!pl||L.gp>=pl.gp){ if(prev!==L.l){S.seen[c.id]=L.l; ch=true;} }
  }));
  if(party&&ups.length) celebrate(ups);
  return ch;
}
function toast(t){ const el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),3300); }
function celebrate(ups,msg){
  haptic(true);
  toast(msg?msg:ups.length===1?`${ups[0].c.name} went up to ${ups[0].L.l}!`:`${ups.length} classes went up a letter grade!`);
  if(reduced()) return;
  const old=document.getElementById('confetti'); if(old) old.remove();
  const W=innerWidth, H=innerHeight, dpr=Math.min(2,window.devicePixelRatio||1), cv=document.createElement('canvas');
  cv.id='confetti'; cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px'; cv.setAttribute('aria-hidden','true');
  document.body.appendChild(cv); const x=cv.getContext('2d'); x.scale(dpr,dpr);
  const cols=Object.values(COLOR_HEX), N=Math.min(170,60+Math.round(W/4));
  const ps=Array.from({length:N},(_,i)=>{const L=i%2===0; return {x:L?-10:W+10,y:H*(.62+Math.random()*.25),vx:(L?1:-1)*(4+Math.random()*8),vy:-(9+Math.random()*10),w:6+Math.random()*6,h:8+Math.random()*9,r:Math.random()*6.3,vr:(Math.random()-.5)*.4,t:Math.random()*6.3,c:cols[i%cols.length]};});
  const t0=performance.now(), END=3200;
  const step=now=>{
    const t=now-t0; x.clearRect(0,0,W,H); let alive=0;
    ps.forEach(p=>{ p.vy+=.32; p.vx*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.t+=.12; if(p.y<H+20) alive++;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.scale(1,Math.cos(p.t)); x.globalAlpha=Math.max(0,Math.min(1,(END-t)/600)); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
    if(alive&&t<END&&cv.isConnected) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

/* ---------- first-time tour ---------- */
const TOUR=[
  {view:'dash',sel:'.tiles',title:'Your dashboard',text:'Your GPA, your average and your number of graded assignments are up top. Problems with your classes show up below them, under Heads up.'},
  {view:'home',sel:'#app button.row[data-act="open"]',alt:'#app [data-act="addClass"]',title:'Check each class',text:'Tap a class to add scores and see what you need on the final. Tap Edit on the class page to make its categories match the syllabus. Classes that still need this say "Check setup."'},
  {view:'home',sel:'#app .wi',title:'Try a score with What-if',text:"Turn on What-if to try out scores you haven't gotten yet. They don't change your real grades."},
  {view:'home',sel:'#tabs [data-act="settings"]',title:'Match your school',text:"In Settings, set your school's grade scale and whether it rounds. Then your letter grades will match your school's."}
];
let tourAt=-1;
function maybeTour(){
  if(tourAt>=0||!S||S.tourDone||ui.route.view!=='dash'||document.querySelector('.scrim')) return;
  tourAt=0; setTimeout(()=>{ if(tourAt===0&&ui.route.view==='dash') showTour(); else tourAt=-1; },700);
}
function endTour(){
  tourAt=-1; const el=document.getElementById('tour'); if(el) el.remove();
  window.removeEventListener('resize',placeTour);
  if(S&&!S.tourDone){ S.tourDone=1; save(); }
}
function showTour(){
  const st=TOUR[tourAt]; if(!st){ endTour(); return; }
  if(ui.route.view!==st.view){ ui.route={view:st.view}; ui.from=st.view; render(); }
  let el=document.getElementById('tour');
  if(!el){ el=document.createElement('div'); el.id='tour'; document.body.appendChild(el); window.addEventListener('resize',placeTour); }
  const last=tourAt===TOUR.length-1;
  el.innerHTML=`<div class="blk"></div><div class="spot"></div><div class="bub" role="dialog" aria-modal="true" aria-labelledby="tour-h"><small>Tip ${tourAt+1} of ${TOUR.length}</small><h3 id="tour-h">${st.title}</h3><p>${st.text}</p><div class="acts"><button class="addrow" data-tour="skip">${last?'':'Skip tour'}</button><button class="btn" data-tour="next" style="padding:9px 18px">${last?'Done':'Next'}</button></div></div>`;
  const t=document.querySelector(st.sel)||(st.alt&&document.querySelector(st.alt));
  if(t&&!t.closest('#tabs')) t.scrollIntoView({block:'center',behavior:reduced()?'auto':'smooth'});
  setTimeout(placeTour,reduced()?0:350);
  const nb=el.querySelector('[data-tour="next"]'); if(nb) nb.focus({preventScroll:true});
}
function placeTour(){
  const el=document.getElementById('tour'), st=TOUR[tourAt]; if(!el||!st) return;
  const t=document.querySelector(st.sel)||(st.alt&&document.querySelector(st.alt));
  const spot=el.querySelector('.spot'), bub=el.querySelector('.bub'), W=innerWidth, H=innerHeight;
  if(!t){ spot.style.cssText='left:50%;top:40%;width:0;height:0'; bub.style.left=Math.max(16,(W-bub.offsetWidth)/2)+'px'; bub.style.top=(H*0.3)+'px'; return; }
  const r=t.getBoundingClientRect(), pad=6, top=Math.max(8,r.top-pad), bot=Math.min(H-8,r.bottom+pad);
  Object.assign(spot.style,{left:(r.left-pad)+'px',top:top+'px',width:(r.width+pad*2)+'px',height:(bot-top)+'px'});
  const bh=bub.offsetHeight, bw=bub.offsetWidth;
  const y=bot+12+bh<H-16?bot+12:Math.max(16,top-12-bh);
  bub.style.top=y+'px'; bub.style.left=Math.min(W-bw-16,Math.max(16,r.left+r.width/2-bw/2))+'px';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tour]'); if(!b) return;
  e.stopPropagation();
  if(b.dataset.tour==='skip'){ endTour(); render(); return; }
  tourAt++; if(tourAt>=TOUR.length){ endTour(); ui.route={view:'dash'}; render(); return; }
  showTour();
},true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&tourAt>=0&&document.getElementById('tour')){ endTour(); render(); } });

function calcView(c){
  if(!c.categories.length) return '';
  const fc=finalCatOf(c);
  const chips=c.categories.map(k=>`<button class="chip ${k.id===fc.id?'on':''}" data-act="pickFinal" data-cls="${c.id}" data-id="${k.id}">${esc(k.name)}</button>`).join('');
  let body='';
  const out=need=>need<=0?'<span class="ok">Locked in</span>':need>100?`<span class="no">Needs ${Math.round(need)}%</span>`:`<span class="n num">${f1(need)}%</span>`;
  const targets=sortedScale().filter(r=>r.min>0);
  if(c.mode==='points'){
    const st=c.categories.map(k=>catStats(k,ui.wi));
    const E=st.reduce((a,s)=>a+s.earned,0),M=st.reduce((a,s)=>a+s.max,0),P=+c.finalPoints||0;
    body=`<div class="fl"><div class="fr"><label for="fp">Final is worth</label><input id="fp" class="num" inputmode="decimal" data-fp="${c.id}" value="${P}"><span class="meta">points</span></div></div>`;
    if(M&&P>0) body+=`<div class="need">${targets.map(r=>{const T=S.round?r.min-.5:r.min;return `<div><b>${esc(r.l)}</b>${out(((T/100)*(M+P)-E)/P*100)}</div>`;}).join('')}</div><p class="note">You have ${E} of ${M} points so far. This assumes the final is the last graded work, so add it once you get the score back.</p>`;
    else body+=`<p class="note">Add some graded work and the final's point value to see what you need.</p>`;
  } else {
    const tw=c.categories.reduce((a,k)=>a+(+k.weight||0),0); const w=tw?(+fc.weight||0)/tw:0;
    const cur=classGrade(c,ui.wi,fc.id);
    if(!w) body=`<p class="note">"${esc(fc.name)}" has no weight. Give it a weight in Edit.</p>`;
    else if(cur==null) body=`<p class="note">Add scores in other categories first.</p>`;
    else body=`<div class="need">${targets.map(r=>{const T=S.round?r.min-.5:r.min;return `<div><b>${esc(r.l)}</b>${out((T-cur*(1-w))/w)}</div>`;}).join('')}</div>
      <p class="note">"${esc(fc.name)}" is ${f1(w*100)}% of your grade. Everything else averages ${f1(cur)}% right now. Categories with no scores yet are assumed to match that average.</p>`;
  }

/* ---------- dashboard ---------- */
const COLOR_HEX={blue:'#007aff',green:'#34c759',indigo:'#5856d6',orange:'#ff9500',pink:'#ff2d55',purple:'#af52de',red:'#ff3b30',teal:'#30b0c7'};
const gradedItems=c=>c.categories.flatMap(k=>k.items.map(i=>({i,k,c}))).filter(x=>isNum(x.i.score)&&+x.i.max>0&&!x.i.whatIf);
const asOf=d=>i=>!i.date||i.date<=d;
// Grade after each graded date. Assignments without a date count from the start.
function histOf(c){
  const items=gradedItems(c); if(!items.length) return [];
  const T=todayStr(), days=[...new Set(items.filter(x=>x.i.date&&x.i.date<=T).map(x=>x.i.date))].sort();
  const pts=[];
  if(items.some(x=>!x.i.date)||!days.length){const base=days.length?nstr(dnum(days[0])-1):T; const g=classGrade(c,false,null,i=>!i.date); if(g!=null) pts.push({d:base,g});}
  days.forEach(d=>{const g=classGrade(c,false,null,asOf(d)); if(g!=null) pts.push({d,g});});
  if(pts.length&&pts[pts.length-1].d<T) pts.push({d:T,g:pts[pts.length-1].g,carry:true});
  return pts;
}
const valAt=(pts,d)=>{let v=null;for(const p of pts){if(p.d<=d)v=p.g;else break;}return v;};
function gpaAt(classes,d){
  let cr=0,pts=0;
  classes.forEach(c=>{if(c.status)return;const g=classGrade(c,false,null,asOf(d));if(g==null)return;const cc=+c.credits||0;cr+=cc;pts+=cc*letterFor(g).gp;});
  return cr?pts/cr:null;
}
function avgAt(classes,d){const gs=classes.filter(c=>!c.status).map(c=>classGrade(c,false,null,asOf(d))).filter(g=>g!=null);return gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:null;}
function delta(now,before,dec,unit){
  if(now==null||before==null) return `<span class="d">No earlier grades</span>`;
  const ch=now-before, z=Math.abs(ch)<Math.pow(10,-dec)/2;
  return `<span class="d ${z?'':ch>0?'up':'down'}">${z?'No change':(ch>0?'▲ ':'▼ ')+Math.abs(ch).toFixed(dec)+unit}`;
}
function trunc(n,max){return n.length>max?n.slice(0,max-1)+'…':n;}
function chartModel(){
  const s=sem(), T=todayStr(), tN=dnum(T);
  const series=s.classes.filter(c=>!c.status).map(c=>({c,pts:histOf(c),col:COLOR_HEX[c.color]||'#007aff'})).filter(x=>x.pts.length);
  let start=ui.range==='1m'?tN-30:ui.range==='3m'?tN-91:Math.min(...series.map(x=>dnum(x.pts[0].d)),tN);
  if(tN-start<7) start=tN-7;
  return {series,start,end:tN};
}
function chartSvg(m,W){
  const H=W<420?250:280, P={l:30,r:W<420?84:96,t:12,b:24};
  const vis=m.series.filter(x=>!ui.focus||x.c.id===ui.focus);
  const seen=[];
  m.series.forEach(x=>{const pin=valAt(x.pts,nstr(m.start)); if(pin!=null) seen.push(pin); x.pts.forEach(p=>{if(dnum(p.d)>=m.start) seen.push(p.g);});});
  const lo=seen.length?Math.min(...seen):80, hi=seen.length?Math.max(...seen):100;
  const y0=Math.max(0,Math.floor((lo-3)/5)*5), y1=Math.max(y0+10,Math.ceil((hi+2)/5)*5);
  const X=n=>P.l+(n-m.start)*(W-P.l-P.r)/(m.end-m.start||1), Y=v=>P.t+(y1-v)*(H-P.t-P.b)/(y1-y0||1);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Grade history by class">`;
  sortedScale().filter(r=>r.min>=y0&&r.min<=y1&&r.min>0).forEach(r=>{g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(r.min)}" y2="${Y(r.min)}" stroke="var(--sep)" stroke-width="1"/><text x="${P.l-6}" y="${Y(r.min)+4}" text-anchor="end" font-size="11" font-weight="600" fill="var(--fg3)">${esc(r.l)}</text>`;});
  const nt=W<420?3:5; for(let i=0;i<nt;i++){const n=Math.round(m.start+i*(m.end-m.start)/(nt-1)); g+=`<text x="${X(n)}" y="${H-6}" text-anchor="${i===0?'start':i===nt-1?'end':'middle'}" font-size="11" fill="var(--fg3)">${shortDate(nstr(n))}</text>`;}
  const lines=[];
  m.series.forEach(x=>{
    const pin=valAt(x.pts,nstr(m.start)), inR=x.pts.filter(p=>dnum(p.d)>=m.start);
    const path=(pin!=null&&(!inR.length||dnum(inR[0].d)>m.start)?[{d:nstr(m.start),g:pin}]:[]).concat(inR);
    if(!path.length) return;
    const dim=ui.focus&&x.c.id!==ui.focus;
    g+=`<path d="${path.map((p,i)=>(i?'L':'M')+X(dnum(p.d)).toFixed(1)+' '+Y(p.g).toFixed(1)).join(' ')}" fill="none" stroke="${x.col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="${dim?0.15:1}"/>`;
    if(!dim) path.filter(p=>!p.carry&&dnum(p.d)>m.start).forEach(p=>{ if(path.length<25) g+=`<circle cx="${X(dnum(p.d))}" cy="${Y(p.g)}" r="2.5" fill="${x.col}"/>`; });
    if(!dim) lines.push({x,y:Y(path[path.length-1].g),v:path[path.length-1].g,ey:Y(path[path.length-1].g)});
  });
  lines.sort((a,b)=>a.y-b.y); for(let i=1;i<lines.length;i++) if(lines[i].y-lines[i-1].y<30) lines[i].y=lines[i-1].y+30;
  const over=lines.length?lines[lines.length-1].y-(H-P.b+6):0; if(over>0) lines.forEach(l=>l.y-=over);
  lines.forEach(l=>{g+=`<circle cx="${X(m.end)}" cy="${l.ey}" r="4.5" fill="${l.x.col}" stroke="#fff" stroke-width="2"/><text x="${X(m.end)+10}" y="${l.y-1}" font-size="12" font-weight="650" fill="var(--fg)">${esc(trunc(l.x.c.name,W<420?10:13))}</text><text x="${X(m.end)+10}" y="${l.y+12}" font-size="11" fill="var(--fg2)">${f1(l.v)}%</text>`;});

function wireChart(){
  const wrap=document.querySelector('.chart-wrap'); if(!wrap||!ui.chart) return;
  const {m,X,Y,P,W,vis}=ui.chart, svg=wrap.querySelector('svg'), tip=wrap.querySelector('.tip'), xh=svg.querySelector('.xh'), dots=svg.querySelector('.xdots');
  const dates=[...new Set([nstr(m.start),...vis.flatMap(x=>x.pts.map(p=>p.d)).filter(d=>dnum(d)>=m.start)])].sort();
  const hide=()=>{tip.hidden=true;xh.setAttribute('visibility','hidden');dots.innerHTML='';};
  const move=e=>{
    const r=svg.getBoundingClientRect(), sx=(e.clientX-r.left)*W/r.width;
    if(sx<P.l-10||sx>W-P.r+10){hide();return;}
    let best=dates[0],bd=1e9; dates.forEach(d=>{const dd=Math.abs(X(dnum(d))-sx); if(dd<bd){bd=dd;best=d;}});
    const x=X(dnum(best)), rows=vis.map(s=>({s,v:valAt(s.pts,best)})).filter(o=>o.v!=null).sort((a,b)=>b.v-a.v);
    if(!rows.length){hide();return;}
    xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
    dots.innerHTML=rows.map(o=>`<circle cx="${x}" cy="${Y(o.v)}" r="4" fill="${o.s.col}" stroke="#fff" stroke-width="2"/>`).join('');
    tip.innerHTML=`<div class="h">${shortDate(best)}</div>`+rows.map(o=>`<div><i style="background:${o.s.col}"></i>${esc(trunc(o.s.c.name,16))}<span>${f1(o.v)}%</span></div>`).join('');
    tip.hidden=false;
    const px=x*r.width/W, tw=tip.offsetWidth;
    tip.style.left=Math.max(0,Math.min(r.width-tw,px>r.width/2?px-tw-12:px+12))+'px'; tip.style.top='8px';
  };
  svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move); svg.addEventListener('pointerleave',hide);
}
function sparkSvg(x,start){
  const pts=[{d:nstr(start),g:valAt(x.pts,nstr(start))}].filter(p=>p.g!=null).concat(x.pts.filter(p=>dnum(p.d)>start));
  if(pts.length<2) return '<span class="spark"></span>';
  const end=dnum(todayStr()), mn=Math.min(...pts.map(p=>p.g)), mx=Math.max(...pts.map(p=>p.g)), sc=mx-mn||1;
  const xy=p=>[((dnum(p.d)-start)/(end-start||1)*80+2).toFixed(1),(24-(p.g-mn)/sc*20+2).toFixed(1)];
  const last=xy(pts[pts.length-1]);
  return `<svg class="spark" viewBox="0 0 84 28" aria-hidden="true"><polyline points="${pts.map(p=>xy(p).join(',')).join(' ')}" fill="none" stroke="${x.col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${x.col}"/></svg>`;
}

async function exportData(){

  const json=JSON.stringify(S,null,2);
  try{
    const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:json}); ui.msg='Export ready.'; render(); return;}
  }catch(e){ if(e&&e.code&&e.code!=='not_granted'&&e.code!=='capability_disabled'){ui.msg='Export was cancelled.';render();return;} }
  try{const u=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);ui.msg='Saved '+name+'.';}
  catch(e){ui.msg='Export did not work here.';}

}

let pendingImport=null;
const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
function mergeInto(d){
  let addC=0,addI=0,upd=0;
  d.semesters.forEach(ds=>{
    let ts=S.semesters.find(x=>same(x.name,ds.name));
    if(!ts){ts={id:uid(),name:ds.name,classes:[]}; S.semesters.push(ts);}
    ds.classes.forEach(dc=>{
      if(dc.example) return;
      let tc=ts.classes.find(x=>same(x.name,dc.name));
      if(!tc){ts.classes.push({...dc,id:uid(),categories:dc.categories.map(k=>({...k,id:uid(),items:k.items.map(i=>({...i,id:uid()}))}))}); addC++; return;}
      dc.categories.forEach(dk=>{
        let tk=tc.categories.find(x=>same(x.name,dk.name));
        if(!tk){tk={...dk,id:uid(),items:[]}; tc.categories.push(tk);}
        dk.items.forEach(di=>{
          const ti=tc.categories.flatMap(k=>k.items).find(x=>same(x.name,di.name));
          if(!ti){tk.items.push({...di,id:uid()}); addI++;}
          else if(isNum(di.score)&&(+ti.score!==+di.score||+ti.max!==+di.max)){ti.score=+di.score; ti.max=+di.max; upd++;}
        });
      });
    });
  });
  return {addC,addI,upd};
}
function fileImportSheet(d){
  pendingImport=d;
  const nC=d.semesters.reduce((a,x)=>a+x.classes.filter(c=>!c.example).length,0), nI=d.semesters.reduce((a,x)=>a+x.classes.reduce((b,c)=>b+(c.example?0:c.categories.reduce((q,k)=>q+k.items.length,0)),0),0);
  openSheet('Import grades',`<div class="fl"><div class="fr"><span class="main"><div class="t">This file has ${nC} class${nC===1?'':'es'} and ${nI} assignment${nI===1?'':'s'}.</div><div class="s meta" style="margin-top:4px">Add keeps everything you have here. It adds new classes and assignments, and updates scores that changed. Classes and assignments are matched by name.</div></span></div></div>
    <button class="btn danger" data-act="impReplace" data-confirm>Replace everything instead</button>`,()=>{
      const r=mergeInto(pendingImport); pendingImport=null;
      ui.msg=`Added ${r.addC} class${r.addC===1?'':'es'} and ${r.addI} assignment${r.addI===1?'':'s'}. Updated ${r.upd} score${r.upd===1?'':'s'}.`;
    },'Add');
}

/* ---------- search ---------- */
function hl(text,terms){
  const re=new RegExp('('+terms.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');
  return String(text).split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
}
function searchResults(q){
  q=String(q||'').trim().toLowerCase(); if(!q) return '';
  const terms=q.split(/\s+/).filter(Boolean), hits=[];
  S.semesters.forEach(s=>s.classes.forEach(c=>{ if(c.example&&!S.examples) return; c.categories.forEach(k=>k.items.forEach(i=>{
    const hay=(i.name+' '+k.name+' '+c.name).toLowerCase();
    if(terms.every(t=>hay.includes(t))) hits.push({s,c,k,i});
  }));}));
  const inName=h=>-terms.filter(t=>h.i.name.toLowerCase().includes(t)).length;
  hits.sort((a,b)=>inName(a)-inName(b)||String(b.i.date||'').localeCompare(String(a.i.date||''))||a.i.name.localeCompare(b.i.name));
  if(!hits.length) return `<section class="glass list"><div class="empty"><div>No assignments match “${esc(q)}”.</div></div></section>`;
  const shown=hits.slice(0,50), many=S.semesters.length>1;
  return `<section><div class="sec-h"><span>Results</span><span>${hits.length>50?'First 50 of '+hits.length:hits.length}</span></div><div class="glass list">${shown.map(h=>{
    const has=isNum(h.i.score)&&+h.i.max>0;
    return `<button class="row tap" data-act="openHit" data-sem="${h.s.id}" data-cls="${h.c.id}" data-cat="${h.k.id}" data-id="${h.i.id}"><span class="dot" style="background:var(--c-${h.c.color})"></span><span class="main"><div class="t">${hl(h.i.name,terms)}${h.i.whatIf?'<span class="pill">What-if</span>':''}</div><div class="s num">${hl(h.c.name,terms)} · ${hl(h.k.name,terms)}${many?' · '+esc(h.s.name):''}${h.i.date?' · '+shortDate(h.i.date):''}</div></span><span class="r num meta">${has?`${+h.i.score} / ${+h.i.max}`:'Not graded'}</span></button>`;}).join('')}</div></section>`;
}

/* ---------- semester progress ---------- */
function semProgress(s){
  if(!isDate(s.start)||!isDate(s.end)||s.end<=s.start) return null;
  const a=dnum(s.start), b=dnum(s.end), t=dnum(todayStr());
  return {elapsed:Math.min(1,Math.max(0,(t-a)/(b-a))), weeksLeft:Math.ceil(Math.max(0,b-t)/7), totalW:Math.ceil((b-a+1)/7), week:Math.floor((t-a)/7)+1, started:t>=a, ended:t>b};
}
const isFinalName=n=>/\b(final|exam|midterm)\b/i.test(n);
// About how much of the final grade comes from graded work. Regular work is assumed to be spread evenly
// over the semester; a final (category or points) counts as not decided until it is graded.
function decidedOf(c,p){
  if(p.ended) return 1;
  const e=Math.max(p.elapsed,0.02);
  if(c.mode==='points'){
    const st=c.categories.map(k=>catStats(k,false)), M=st.reduce((x,q)=>x+q.max,0); if(!M) return 0;
    const finDone=c.categories.some(k=>k.items.some(i=>isFinalName(i.name)&&isNum(i.score)));
    return Math.min(1,M/(M/e+(finDone?0:+c.finalPoints||0)));
  }
  const ws=c.categories.filter(k=>+k.weight>0), tw=ws.reduce((x,k)=>x+ +k.weight,0); if(!tw) return 0;
  return ws.reduce((x,k)=>{const q=catStats(k,false); if(!q.max) return x; return x+ +k.weight*(isFinalName(k.name)?1:Math.min(1,e));},0)/tw;
}
function progressCard(s){
  const p=semProgress(s);
  if(!p) return `<section class="glass card"><div class="ch-head"><h2>Semester progress</h2></div><p class="note">Add the first and last day of ${esc(s.name)} to see how many weeks are left and how much of each grade is already decided.</p><div><button class="btn ghost" data-act="editSem">Set semester dates</button></div></section>`;
  const rows=s.classes.filter(c=>!c.status).map(c=>{
    const g=classGrade(c,false); if(g==null) return '';
    const D=decidedOf(c,p), lo=g*D, hi=g*D+100*(1-D);
    return `<div class="prow"><div class="t"><span class="dot" style="background:var(--c-${c.color})"></span><span>${esc(c.name)}</span></div><span class="num meta">${Math.round(D*100)}% decided</span><div class="bar"><i style="width:${(D*100).toFixed(1)}%;background:var(--c-${c.color})"></i></div><div class="s num">${D>=.995?`Final: ${f1(g)}% (${esc(letterFor(g).l)})`:`Final grade can still land between ${Math.round(lo)}% (${esc(letterFor(lo).l)}) and ${Math.min(100,Math.round(hi))}% (${esc(letterFor(Math.min(100,hi)).l)})`}</div></div>`;
  }).join('');
  const head=p.ended?'Finished':!p.started?`Starts ${shortDate(s.start)}`:`${p.weeksLeft} week${p.weeksLeft===1?'':'s'} left`;
  const sub=p.started&&!p.ended?`Week ${Math.min(p.week,p.totalW)} of ${p.totalW} · ends ${shortDate(s.end)}`:`${shortDate(s.start)} – ${shortDate(s.end)}`;
  return `<section class="glass card prog"><div class="ch-head"><h2>Semester progress</h2><button class="ack" data-act="editSem">Edit dates</button></div>
   <div class="top"><b class="num">${head}</b><span class="meta num">${sub}</span></div>
   <div class="bar" role="img" aria-label="${Math.round(p.elapsed*100)}% of the semester has passed"><i style="width:${(p.elapsed*100).toFixed(1)}%;background:var(--accent)"></i></div>
   ${rows?`<div class="fl">${rows}</div>`:''}
   <p class="note">“Decided” estimates how much of each final grade comes from work that's already graded. It assumes regular work is spread evenly over the semester, and counts finals as undecided until they're graded. The range assumes everything left scores between 0% and 100%.</p></section>`;
}

function drawReport(s){

  const gx=W-M; x.textAlign='right';
  x.fillStyle=ink2; font(700,20); x.fillText('SEMESTER GPA',gx,130);

  x.fillStyle=ink2; font(400,24); x.fillText(cum?`Cumulative GPA ${cum.gpa.toFixed(2)}`:'',gx,248);

  x.fillStyle=rule; x.fillRect(M,404,W-2*M,2);

async function saveBlob(name,blob){
  try{const dl=window.claude&&claude.use?await claude.use('downloads'):null; if(dl){await dl.save({filename:name,data:blob}); return 'Saved '+name+'.';}}
  catch(e){ if(e&&e.code&&e.code!=='not_granted'&&e.code!=='capability_disabled') return 'Save was cancelled.'; }
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return 'Saved '+name+'.';}
  catch(e){return 'Saving did not work here.';}
}
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf);
  return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=()=>window.jspdf?res(window.jspdf):rej(new Error('missing'));sc.onerror=rej;document.head.appendChild(sc);});
}
function reportSheet(){
  let semId=sem().id, cv=null;
  openSheet('Report card',`
    ${S.semesters.length>1?`<div class="chips" role="group" aria-label="Semester">${S.semesters.map(q=>`<button type="button" class="chip ${q.id===semId?'on':''}" data-act="rcSem" data-id="${q.id}">${esc(q.name)}</button>`).join('')}</div>`:''}
    <img id="rc-img" class="rc-prev" alt="Report card preview">
    <div class="rc-acts"><button class="btn" data-act="rcSave" data-kind="pdf">Save as PDF</button><button class="btn ghost" data-act="rcSave" data-kind="png">Save as image</button></div>
    <div id="rc-msg" class="note" role="status"></div>
    <p class="hint" style="margin:0">Uses your actual grades. What-if scores are left out. The page says it was made from grades you entered, since it isn't an official school record.</p>`,()=>{},'Done');
  const msg=t=>{const el=document.getElementById('rc-msg'); if(el) el.textContent=t;};
  const draw=()=>{const s=S.semesters.find(q=>q.id===semId)||sem(); cv=drawReport(s); const img=document.getElementById('rc-img'); if(img) img.src=cv.toDataURL('image/png');};
  draw();
  rcApi={
    setSem(id){semId=id; root.querySelectorAll('[data-act="rcSem"]').forEach(b=>b.classList.toggle('on',b.dataset.id===id)); draw(); msg('');},
    async save(kind){
      const s=S.semesters.find(q=>q.id===semId)||sem();
      const base=('Report card - '+(S.name||'Student')+' - '+s.name).replace(/[\\/:*?"<>|]+/g,'-');
      try{
        if(kind==='png'){ const blob=await new Promise(r=>cv.toBlob(r,'image/png')); msg(await saveBlob(base+'.png',blob)); return; }
        msg('Making the PDF…');
        const {jsPDF}=await loadJsPDF(); const doc=new jsPDF({unit:'in',format:'letter',orientation:'portrait'});
        doc.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,8.5,11);
        msg(await saveBlob(base+'.pdf',doc.output('blob')));
      }catch(e){ msg(kind==='pdf'?'The PDF could not be made here. Try Save as image instead.':'Saving did not work here.'); }
    }
  };
}

/* ---------- assignment dates ---------- */
let datesApi=null;
function datesSheet(onlyClass){
  const classes=sem().classes.filter(c=>!onlyClass||c.id===onlyClass);
  const all=classes.flatMap(c=>c.categories.flatMap(k=>k.items.filter(i=>!i.whatIf).map(i=>({c,k,i}))));
  const pending={}; let mode=all.some(x=>!x.i.date)?'missing':'all', shown=[];
  const val2=i=>pending[i.id]!==undefined?pending[i.id]:(i.date||'');
  function draw(){
    shown=all.filter(x=>mode==='all'||!x.i.date);
    const el=document.getElementById('dl'); if(!el) return;
    if(!shown.length){el.innerHTML=`<div class="fl"><div class="empty"><div>${all.length?'Every assignment has a date.':'No assignments yet.'}</div></div></div>`;return;}
    let html='', cur=null, first=true;
    shown.forEach(x=>{
      if(x.c!==cur){ if(cur) html+='</div></div>'; cur=x.c; first=true;
        const n=shown.filter(y=>y.c===x.c).length;
        html+=`<div><div class="sec-h" style="padding-top:2px"><span><span class="dot" style="display:inline-block;background:var(--c-${x.c.color});margin-right:6px;vertical-align:0"></span>${esc(x.c.name)}</span><span>${n}</span></div><div class="fl">`; }
      const v=val2(x.i), has=isNum(x.i.score)&&+x.i.max>0;
      html+=`<div class="drow ${v?'':'missing'}"><span class="main"><div class="t">${esc(x.i.name)}</div><div class="s num">${esc(x.k.name)} · ${has?`${+x.i.score} / ${+x.i.max}`:'Not graded'}</div></span><span class="ctl">${first?'':`<button type="button" class="same" data-act="sameAbove">Same as above</button>`}<input type="date" data-did="${x.i.id}" aria-label="Date for ${esc(x.i.name)}" value="${esc(v)}" max="${todayStr()}"></span></div>`;
      first=false;
    });
    el.innerHTML=html+'</div></div>';
  }
  const missingN=all.filter(x=>!x.i.date).length;
  openSheet(onlyClass?'Assignment dates':'All assignment dates',`
    <p class="hint" style="margin:0">Set the day each assignment was graded. The dashboard chart redraws your grade history from these dates. Orange boxes still need a date.</p>
    <div class="fl"><div class="fr">${segHtml('dmode',[['missing',`Missing (${missingN})`],['all','All']],mode)}</div></div>
    <div id="dl" style="display:grid;gap:14px"></div>`,()=>{
      let n=0;
      all.forEach(x=>{const v=pending[x.i.id]; if(v===undefined) return; const nv=isDate(v)?v:''; if(nv!==(x.i.date||'')){x.i.date=nv;n++;}});
      ui.msg=''; ui.datesSaved=n;
    },'Save');
  draw();
  datesApi={
    mode(v){mode=v;draw();},
    set(inp){pending[inp.dataset.did]=inp.value; inp.closest('.drow').classList.toggle('missing',!inp.value);},
    same(btn){
      const ins=[...root.querySelectorAll('[data-did]')], me=btn.closest('.drow').querySelector('[data-did]'), i=ins.indexOf(me);
      for(let j=i-1;j>=0;j--){ if(ins[j].value){ me.value=ins[j].value; datesApi.set(me); haptic(); return; } }
    }
  };
}

/* ---------- import: pasted list ---------- */
let importApi=null;
function guessCat(name,c){
  const n=String(name).toLowerCase();
  const tests=[[/quiz/,/quiz/],[/\b(test|exam|midterm|final)\b/,/test|exam/],[/\b(hw|homework)\b/,/homework|hw/],[/project/,/project/],[/\blab\b/,/lab/],[/essay|paper/,/essay|paper/],[/article|story|review|pitch/,/article|stor/]];
  for(const [re,cre] of tests){ if(re.test(n)){const k=c.categories.find(k=>cre.test(k.name.toLowerCase())); if(k) return k;} }
  return c.categories[0];
}
function parsePasted(txt){
  const out=[]; let last='';
  const num='(\\d+(?:\\.\\d+)?)';
  const full=new RegExp('^(.*?[A-Za-z].*?)[\\s:\\-–|,\\t]+'+num+'\\s*(?:/|out of)\\s*'+num,'i');
  const only=new RegExp('^\\s*'+num+'\\s*(?:/|out of)\\s*'+num,'i');
  const pct=new RegExp('^(.*?[A-Za-z].*?)[\\s:\\-–|,\\t]+'+num+'\\s*%');
  String(txt).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{
    let m;
    if((m=l.match(full))) out.push({name:m[1].trim(),score:+m[2],max:+m[3]});
    else if((m=l.match(only))&&last){out.push({name:last,score:+m[1],max:+m[2]}); last='';}
    else if((m=l.match(pct))) out.push({name:m[1].trim(),score:+m[2],max:100});
    else if(/[A-Za-z]/.test(l)&&!/^(assigned|missing|turned in|graded|returned|done late|due\b)/i.test(l)) last=l;
  });
  return out;
}
function importSheet(c){
  let found=[];
  openSheet('Import grades',`
    <p class="hint" style="margin:0">Open your grades in Google Classroom or your school's grade portal. Select the list, copy it and paste it here. Each assignment needs a name and a score, like "Quiz 1 18/20". This doesn't connect to your school account.</p>
    <div class="fl"><textarea id="imp-txt" placeholder="Quiz 1   18/20&#10;Unit 2 test   42/50&#10;HW 3.4   5/5"></textarea></div>
    <button class="btn block" data-act="impRead" id="imp-go">Read grades</button>
    <div id="imp-msg" role="status" class="note"></div>
    <div id="imp-res"></div>`,()=>{
      const rows=[...root.querySelectorAll('.irow')].filter(r=>r.querySelector('.ck.on'));
      if(!found.length) return 'Read your grades first, then tap Add.';
      if(!rows.length) return 'Pick at least one assignment to add.';
      rows.forEach(r=>{
        const g=f=>r.querySelector(`[data-if="${f}"]`).value.trim();
        const name=g('name')||'Untitled', sc=g('score'), mx=g('max');
        const ex=c.categories.flatMap(k=>k.items).find(i=>same(i.name,name));
        const score=isNum(sc)?+sc:'', max=isNum(mx)&&+mx>0?+mx:(ex?ex.max:100), date=isDate(g('date'))?g('date'):'';
        if(ex){ex.score=score; ex.max=max; if(date) ex.date=date;}
        else{const k=c.categories.find(k=>k.id===g('cat'))||c.categories[0]; k.items.push({id:uid(),name,score,max,whatIf:false,date});}
      });
    },'Add');
  const msg=t=>{document.getElementById('imp-msg').innerHTML=t;};
  function show(items){
    found=items.filter(i=>i&&i.name);
    if(!found.length){msg('No grades found. Each line needs a name and a score, like Quiz 1 18/20.'); document.getElementById('imp-res').innerHTML=''; return;}
    const all=c.categories.flatMap(k=>k.items);
    document.getElementById('imp-res').innerHTML=`<div class="sec-h" style="padding-top:4px"><span>Check before adding</span><span>${found.length}</span></div><div class="fl">${found.map((it,i)=>{
      const ex=all.find(x=>same(x.name,it.name));
      const k=c.categories.find(k=>same(k.name,it.category))||guessCat(it.name,c);
      const has=isNum(it.score);
      return `<div class="irow ${has?'':'off'}"><button type="button" class="ck ${has?'on':''}" data-act="impCk" aria-pressed="${has}" aria-label="Include ${esc(it.name)}">✓</button><div class="main"><input class="nm" data-if="name" aria-label="Assignment name" value="${esc(it.name)}">
        <div class="line"><input class="sc num" data-if="score" inputmode="decimal" aria-label="Score" placeholder="–" value="${has?+it.score:''}"><span class="meta">/</span><input class="sc num" data-if="max" inputmode="decimal" aria-label="Out of" value="${isNum(it.max)?+it.max:''}">
        <input type="date" data-if="date" aria-label="Date graded" value="${isDate(it.date)?it.date:todayStr()}" style="min-width:130px">
        <select data-if="cat" aria-label="Category">${c.categories.map(x=>`<option value="${x.id}" ${x.id===k.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
        <span class="tag ${ex?'upd':'new'}">${ex?'Updates':'New'}</span></div></div></div>`;}).join('')}</div>
      <p class="hint" style="margin-top:8px">Unchecked rows have no score yet. Tap Add to save the checked ones. "Updates" replaces the score of an assignment you already have.</p>`;
    msg(`Found ${found.length} assignment${found.length===1?'':'s'}.`);
    haptic(true);
  }
  importApi={
    read(){ const txt=val('imp-txt'); if(!txt){msg('Paste your grade list first.');return;} show(parsePasted(txt)); }
  };
}

render();
boot();
